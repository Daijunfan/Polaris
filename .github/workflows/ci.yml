name: Checks
on: [push, pull_request]
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run vault:check
      - run: npm test
      - run: npm run build
      - name: Launcher syntax & EOL check (Unix)
        if: runner.os != 'Windows'
        run: sh -n start.command && test -x start.command
      - name: Launcher CRLF & content check
        run: |
          node -e "const fs=require('node:fs');const cmd=fs.readFileSync('start.cmd','utf8');if(!cmd.includes('\r\n')||/(?<!\r)\n/.test(cmd))throw new Error('start.cmd must use CRLF');const sh=fs.readFileSync('start.command','utf8');if(sh.includes('\r'))throw new Error('start.command must use LF')"
      - name: Cross-platform CLI smoke
        run: |
          node bin/mentor.mjs --version
          node bin/mentor.mjs --help
          node bin/mentor.mjs schemas
          node bin/mentor.mjs catalog
          node scripts/start.mjs --check
          node -e "const {execFileSync}=require('node:child_process');const q=execFileSync(process.execPath,['bin/mentor.mjs','query','--from','mentors','--where',JSON.stringify([{field:'college',op:'eq',value:'网络空间安全学院'}])],{encoding:'utf8'});const agg=execFileSync(process.execPath,['bin/mentor.mjs','aggregate','--from','-','--metrics',JSON.stringify([{op:'count',as:'n'}])],{input:q,encoding:'utf8'});const out=JSON.parse(agg);if(!out.rows||!(out.rows[0].n>0))throw new Error('Unexpected CLI pipe output: '+agg)"
      - name: Package & extracted smoke test
        if: matrix.node == 24
        run: |
          npm run package
          node -e "const fs=require('node:fs');const os=require('node:os');const path=require('node:path');const crypto=require('node:crypto');const {execFileSync}=require('node:child_process');const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));const archive=path.resolve('.local/releases',pkg.name+'-'+pkg.version+'.tar.gz');const manifestPath=path.resolve('.local/releases',pkg.name+'-'+pkg.version+'.manifest.json');const manifest=JSON.parse(fs.readFileSync(manifestPath,'utf8'));const actualSha=crypto.createHash('sha256').update(fs.readFileSync(archive)).digest('hex');if(manifest.sha256!==actualSha)throw new Error('Manifest sha256 mismatch');const vaults=['dataset','pdf-reviews','mentor-notes','web-profiles','web-seeds'].map(v=>'data/'+v+'.vault');for(const v of vaults){if(!manifest.files?.some(f=>f.path===v&&f.sha256))throw new Error('Manifest missing vault: '+v)}const smoke=path.join(process.env.RUNNER_TEMP||os.tmpdir(),'pkg-smoke');fs.rmSync(smoke,{recursive:true,force:true});fs.mkdirSync(smoke,{recursive:true});fs.copyFileSync(archive,path.join(smoke,'release.tar.gz'));execFileSync('tar',['-xzf','release.tar.gz'],{cwd:smoke,stdio:'inherit'});const extracted=path.join(smoke,pkg.name+'-'+pkg.version);for(const v of vaults){if(!fs.existsSync(path.join(extracted,v)))throw new Error('Extracted package missing vault: '+v)}const npmCmd=process.platform==='win32'?['cmd.exe',['/d','/c','npm.cmd','ci','--omit=dev','--no-audit','--no-fund']]:['npm',['ci','--omit=dev','--no-audit','--no-fund']];execFileSync(npmCmd[0],npmCmd[1],{cwd:extracted,stdio:'inherit'});const cat=JSON.parse(execFileSync(process.execPath,['bin/mentor.mjs','catalog'],{cwd:extracted,encoding:'utf8'}));if(cat.metadata?.vault_locked===true||!(cat.metadata?.counts?.mentors>=1))throw new Error('Extracted package catalog check failed: '+JSON.stringify(cat));fs.rmSync(smoke,{recursive:true,force:true})"
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium --only-shell
      - if: runner.os != 'Linux'
        run: npx playwright install chromium --only-shell
      - run: npm run test:e2e
