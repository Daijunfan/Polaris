name: Checks
on: [push, pull_request]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          MENTOR_VAULT_KEY: ${{ secrets.MENTOR_VAULT_KEY }}
      - run: npm run build
  browser:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:e2e
        env:
          MENTOR_VAULT_KEY: ${{ secrets.MENTOR_VAULT_KEY }}
